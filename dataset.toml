# Release metadata for the Harbor-native gold dataset.
# The executable Harbor registry is `registry.json`.

schema_version = "1.0"

[dataset]
name = "formal-conjectures-gold"
version = "1.3.0"
description = "76 offline Lean 4 theorem-proving tasks from FormalConjectures-Bench with bundled oracle solutions."
authors = [{ name = "Allen Graham Hart" }]
keywords = ["lean4", "theorem-proving", "formal-mathematics", "harbor"]
task_count = 76
harbor_registry = "registry.json"
huggingface_metadata = "huggingface/formal-conjectures-gold/tasks.jsonl"
